<line x1="91" y1="47.8" x2="106" y2="47.8" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="110" y="47" font-size="3.5" fill="#333" font-weight="500">লিঙ্গ: </text>
<line x1="119" y1="47.8" x2="140" y2="47.8" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="8" y="55" font-size="3.5" fill="#333" font-weight="500">ঠিকানা: </text>
<line x1="23" y1="55.8" x2="78" y2="55.8" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
