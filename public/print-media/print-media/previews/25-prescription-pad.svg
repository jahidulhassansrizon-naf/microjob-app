<line x1="52" y1="64" x2="52" y2="178" stroke="#9ec7d6" stroke-width="0.4"/>
<text x="10" y="70" font-size="3.6" fill="#0b5d7a" font-weight="700">রোগের বিবরণ / পরীক্ষা</text>
<text x="56" y="76" font-size="11" fill="#e63946" font-weight="700" data-layer-name="Rx symbol">Rx</text>
<rect x="0" y="186" width="148" height="24" fill="#e8f4f8" data-layer-name="Footer"/>
<text x="74" y="194" font-size="3.5" fill="#0b5d7a" font-weight="600" text-anchor="middle">চেম্বার: আপনার চেম্বারের ঠিকানা, শহর</text>
<text x="74" y="200" font-size="3.3" fill="#333" font-weight="400" text-anchor="middle">রোগী দেখার সময়: বিকাল ৫টা – রাত ৯টা (শুক্রবার বন্ধ)</text>
<text x="74" y="206" font-size="3.5" fill="#e63946" font-weight="700" text-anchor="middle">সিরিয়ালের জন্য: ০১৭০০-০০০০০০</text>
<g display="none" id="safe-area-guide" data-print="false"><rect x="5" y="5" width="138" height="200" fill="none" stroke="#e11d48" stroke-width="0.25" stroke-dasharray="2 1.5" opacity="0.55"/></g>
