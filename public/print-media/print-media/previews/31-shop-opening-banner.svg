<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="914.4mm" height="609.6mm" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', sans-serif">
<rect x="0" y="0" width="300" height="200" fill="#c1121f" data-layer-name="Background"/>
