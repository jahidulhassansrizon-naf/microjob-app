<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 148" width="210mm" height="148mm" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', sans-serif">
<rect x="0" y="0" width="210" height="148" fill="#ffffff" data-layer-name="Background"/>
<rect x="5" y="5" width="200" height="138" fill="none" stroke="#1d4ed8" stroke-width="0.8" data-layer-name="Border"/>
<rect x="5" y="5" width="200" height="26" fill="#1d4ed8" data-layer-name="Header"/>
<circle cx="20" cy="18" r="8" fill="none" stroke="#bfdbfe" stroke-width="0.4" stroke-dasharray="1.5 1" data-layer-name="Logo placeholder"/>
<text x="20" y="19" font-size="3" fill="#bfdbfe" font-weight="500" text-anchor="middle">লোগো</text>
<text x="110" y="16" font-size="12" fill="#ffffff" font-weight="800" text-anchor="middle">প্রতিষ্ঠানের নাম</text>
<text x="110" y="23" font-size="4" fill="#bfdbfe" font-weight="500" text-anchor="middle">ঠিকানা: বাজার রোড, থানা, জেলা</text>
<rect x="70" y="36" width="70" height="10" fill="#fbbf24" rx="5" data-layer-name="Title pill"/>
<text x="105" y="43.2" font-size="6" fill="#1e293b" font-weight="800" text-anchor="middle">প্রবেশপত্র (ADMIT CARD)</text>
<text x="105" y="51.5" font-size="4.6" fill="#1d4ed8" font-weight="700" text-anchor="middle">বার্ষিক / সাময়িক পরীক্ষা – ২০২৬</text>
<rect x="165" y="55" width="33" height="40" fill="none" stroke="#94a3b8" stroke-width="0.4" stroke-dasharray="1.5 1" data-layer-name="Photo box"/>
<text x="181.5" y="76" font-size="4" fill="#94a3b8" font-weight="500" text-anchor="middle">ছবি</text>
<text x="14" y="62" font-size="4.4" fill="#333" font-weight="600">পরীক্ষার্থীর নাম: </text>
<line x1="38.38" y1="62.9" x2="160" y2="62.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="14" y="71" font-size="4.4" fill="#333" font-weight="600">পিতার নাম: </text>
<line x1="33.804" y1="71.9" x2="160" y2="71.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="14" y="80" font-size="4.4" fill="#333" font-weight="600">শ্রেণি: </text>
<line x1="24.652" y1="80.9" x2="62" y2="80.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="66" y="80" font-size="4.4" fill="#333" font-weight="600">শাখা: </text>
<line x1="76.652" y1="80.9" x2="105" y2="80.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="110" y="80" font-size="4.4" fill="#333" font-weight="600">রোল নং: </text>
<line x1="125.22800000000001" y1="80.9" x2="160" y2="80.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="14" y="89" font-size="4.4" fill="#333" font-weight="600">রেজিস্ট্রেশন নং: </text>
<line x1="36.092" y1="89.9" x2="90" y2="89.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="96" y="89" font-size="4.4" fill="#333" font-weight="600">পরীক্ষা কেন্দ্র: </text>
<line x1="115.804" y1="89.9" x2="160" y2="89.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="14" y="98" font-size="4.4" fill="#333" font-weight="600">পরীক্ষা শুরু: </text>
<line x1="33.804" y1="98.9" x2="90" y2="98.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="96" y="98" font-size="4.4" fill="#333" font-weight="600">সময়: </text>
<line x1="111.22800000000001" y1="98.9" x2="160" y2="98.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<rect x="14" y="104" width="184" height="18" fill="#eff6ff" rx="2" stroke="#bfdbfe" stroke-width="0.3" data-layer-name="Instruction box"/>
<text x="17" y="110" font-size="4" fill="#1d4ed8" font-weight="700">নির্দেশনা:</text>
<text x="17" y="115" font-size="3.2" fill="#334155" font-weight="500">১. পরীক্ষার হলে এই প্রবেশপত্র সঙ্গে আনা বাধ্যতামূলক।  ২. নির্ধারিত সময়ের ১৫ মিনিট আগে উপস্থিত হতে হবে।</text>
<text x="17" y="119.5" font-size="3.2" fill="#334155" font-weight="500">৩. মোবাইল ফোন বা অননুমোদিত কোনো সামগ্রী পরীক্ষা কক্ষে আনা যাবে না।</text>
<line x1="16" y1="134" x2="68" y2="134" stroke="#555" stroke-width="0.3"/>
<text x="42" y="138.5" font-size="3.6" fill="#555" font-weight="600" text-anchor="middle">পরীক্ষার্থীর স্বাক্ষর</text>
<line x1="78" y1="134" x2="130" y2="134" stroke="#555" stroke-width="0.3"/>
<text x="104" y="138.5" font-size="3.6" fill="#555" font-weight="600" text-anchor="middle">শ্রেণি শিক্ষক</text>
<line x1="140" y1="134" x2="192" y2="134" stroke="#555" stroke-width="0.3"/>
<text x="166" y="138.5" font-size="3.6" fill="#555" font-weight="600" text-anchor="middle">প্রধান শিক্ষক / অধ্যক্ষ</text>
</svg>
