<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', sans-serif">
<rect x="0" y="0" width="210" height="297" fill="#ffffff" data-layer-name="Background"/>
<rect x="0" y="0" width="210" height="38" fill="#14305a" data-layer-name="Header"/>
<rect x="0" y="38" width="210" height="2.2" fill="#c8a24a" data-layer-name="Header accent"/>
<circle cx="26" cy="19" r="10.5" fill="none" stroke="#c8a24a" stroke-width="0.5" stroke-dasharray="1.6 1.2" data-layer-name="Logo placeholder"/>
<text x="26" y="20.2" font-size="3.2" fill="#c8a24a" font-weight="500" text-anchor="middle">লোগো</text>
<text x="118" y="19" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle" data-layer-name="Company name">প্রতিষ্ঠানের নাম</text>
<text x="118" y="27" font-size="3.8" fill="#d6e0f2" font-weight="500" text-anchor="middle">ঠিকানা: বাজার রোড, থানা, জেলা  |  মোবাইল: ০১৭০০-০০০০০০</text>
<text x="118" y="33" font-size="3.4" fill="#9fb3d6" font-weight="500" text-anchor="middle">ইমেইল: info@example.com  |  ওয়েবসাইট: www.example.com</text>
<text x="18" y="52" font-size="4.2" fill="#333" font-weight="600">স্মারক নং:</text>
<line x1="33.36" y1="52.9" x2="85" y2="52.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="130" y="52" font-size="4.2" fill="#333" font-weight="600">তারিখ:</text>
<line x1="139.82" y1="52.9" x2="192" y2="52.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<rect x="70" y="59" width="70" height="11" fill="#14305a" rx="5.5" data-layer-name="Title pill"/>
<text x="105" y="66.8" font-size="7" fill="#ffffff" font-weight="800" text-anchor="middle" data-layer-name="Title">নিয়োগপত্র</text>
<text x="105" y="75" font-size="3.2" fill="#14305a" font-weight="700" text-anchor="middle" letter-spacing="1.6">APPOINTMENT LETTER</text>
<text x="18" y="88" font-size="4.4" fill="#14305a" font-weight="700">জনাব / জনাবা</text>
<text x="18" y="96" font-size="4.4" fill="#333" font-weight="600">নাম:</text>
<line x1="25.31" y1="96.9" x2="120" y2="96.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="18" y="104" font-size="4.4" fill="#333" font-weight="600">পিতার নাম:</text>
<line x1="34.02" y1="104.9" x2="120" y2="104.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="18" y="112" font-size="4.4" fill="#333" font-weight="600">ঠিকানা:</text>
<line x1="29.66" y1="112.9" x2="192" y2="112.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="18" y="124" font-size="4.6" fill="#14305a" font-weight="800">বিষয়: </text>
<line x1="34" y1="124.9" x2="192" y2="124.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<text x="18" y="134" font-size="4" fill="#333" font-weight="500">সূত্র: আপনার আবেদন ও সাক্ষাৎকারের প্রেক্ষিতে নিম্নলিখিত শর্তসাপেক্ষে আপনাকে নিয়োগ প্রদান করা হলো।</text>
<rect x="18" y="142" width="174" height="63" fill="#f4f7fc" stroke="#14305a" stroke-width="0.35" data-layer-name="Terms box"/>
<text x="22" y="148" font-size="4.2" fill="#14305a" font-weight="700">পদবি</text>
<line x1="76" y1="148.9" x2="188" y2="148.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<line x1="18" y1="151" x2="192" y2="151" stroke="#b8c6de" stroke-width="0.2"/>
<text x="22" y="157" font-size="4.2" fill="#14305a" font-weight="700">বিভাগ / শাখা</text>
<line x1="76" y1="157.9" x2="188" y2="157.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<line x1="18" y1="160" x2="192" y2="160" stroke="#b8c6de" stroke-width="0.2"/>
<text x="22" y="166" font-size="4.2" fill="#14305a" font-weight="700">যোগদানের তারিখ</text>
<line x1="76" y1="166.9" x2="188" y2="166.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<line x1="18" y1="169" x2="192" y2="169" stroke="#b8c6de" stroke-width="0.2"/>
<text x="22" y="175" font-size="4.2" fill="#14305a" font-weight="700">মাসিক বেতন (মোট)</text>
<line x1="76" y1="175.9" x2="188" y2="175.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<line x1="18" y1="178" x2="192" y2="178" stroke="#b8c6de" stroke-width="0.2"/>
<text x="22" y="184" font-size="4.2" fill="#14305a" font-weight="700">কর্মস্থল</text>
<line x1="76" y1="184.9" x2="188" y2="184.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<line x1="18" y1="187" x2="192" y2="187" stroke="#b8c6de" stroke-width="0.2"/>
<text x="22" y="193" font-size="4.2" fill="#14305a" font-weight="700">কাজের সময়</text>
<line x1="76" y1="193.9" x2="188" y2="193.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<line x1="18" y1="196" x2="192" y2="196" stroke="#b8c6de" stroke-width="0.2"/>
<text x="22" y="202" font-size="4.2" fill="#14305a" font-weight="700">শিক্ষানবিশকাল (প্রবেশন)</text>
<line x1="76" y1="202.9" x2="188" y2="202.9" stroke="#888" stroke-width="0.25" stroke-dasharray="0.6 0.8"/>
<line x1="72" y1="142" x2="72" y2="205" stroke="#14305a" stroke-width="0.3"/>
<text x="18" y="214" font-size="4.6" fill="#14305a" font-weight="800">শর্তাবলী:</text>
<text x="18" y="222.0" font-size="3.9" fill="#333" font-weight="500">১. প্রতিষ্ঠানের নিয়ম-কানুন ও আচরণবিধি মেনে চলতে হবে।</text>
<text x="18" y="229.2" font-size="3.9" fill="#333" font-weight="500">২. যোগদানের সময় শিক্ষাগত সনদ, জাতীয় পরিচয়পত্র ও ছবি জমা দিতে হবে।</text>
<text x="18" y="236.4" font-size="3.9" fill="#333" font-weight="500">৩. চাকরি ছাড়তে চাইলে অন্তত ৩০ দিন আগে লিখিত নোটিশ দিতে হবে।</text>
<text x="18" y="243.6" font-size="3.9" fill="#333" font-weight="500">৪. প্রতিষ্ঠানের গোপনীয় তথ্য কোনোভাবেই প্রকাশ করা যাবে না।</text>
<text x="18" y="250.8" font-size="3.9" fill="#333" font-weight="500">৫. অন্যান্য সুযোগ-সুবিধা প্রতিষ্ঠানের নীতিমালা অনুযায়ী প্রযোজ্য হবে।</text>
<text x="18" y="262" font-size="4.2" fill="#333" font-weight="600">আপনার সাফল্য কামনা করছি।</text>
<line x1="18" y1="281" x2="78" y2="281" stroke="#555" stroke-width="0.3"/>
<text x="48.0" y="286" font-size="3.8" fill="#14305a" font-weight="600" text-anchor="middle">নিয়োগকর্তার স্বাক্ষর ও সিল</text>
<line x1="132" y1="281" x2="192" y2="281" stroke="#555" stroke-width="0.3"/>
<text x="162.0" y="286" font-size="3.8" fill="#14305a" font-weight="600" text-anchor="middle">গ্রহণকারীর স্বাক্ষর ও তারিখ</text>
<rect x="0" y="291" width="210" height="6" fill="#14305a" data-layer-name="Footer band"/>
</svg>
