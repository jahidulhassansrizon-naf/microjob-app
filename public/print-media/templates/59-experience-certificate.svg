<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="'Hind Siliguri', 'Noto Sans Bengali', 'Nirmala UI', sans-serif">
<rect x="0" y="0" width="210" height="297" fill="#fffdf6" data-layer-name="Background"/>
<rect x="6" y="6" width="198" height="285" fill="none" stroke="#0f5132" stroke-width="1.4" data-layer-name="Outer border"/>
<rect x="9" y="9" width="192" height="279" fill="none" stroke="#c8a24a" stroke-width="0.4" data-layer-name="Inner border"/>
<circle cx="6" cy="6" r="3.2" fill="#0f5132" data-layer-name="Corner ornament"/>
<circle cx="6" cy="6" r="1.4" fill="#ffffff" data-layer-name="Corner ornament dot"/>
