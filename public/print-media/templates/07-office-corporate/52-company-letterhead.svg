<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="Company Letterhead editable print media template">
<title>Company Letterhead</title><desc>Editable SVG print template. Text, shapes, placeholders and colors are separate vector elements.</desc>
<rect id="background" data-layer-name="Background" data-editable="true" x="0" y="0" width="900" height="1200" fill="#FBF8F0"/>
<g id="decorative-background" data-layer-name="Decorative background"><circle id="Decorative corner circle-0" data-layer-name="Decorative corner circle" data-editable="true" cx="865" cy="35" r="110" fill="#EFE8D9"/><circle id="Decorative corner accent-1" data-layer-name="Decorative corner accent" data-editable="true" cx="25" cy="1175" r="85" fill="#B58A3C"/><rect id="Letterhead header-2" data-layer-name="Letterhead header" data-editable="true" x="0" y="0" width="900" height="155" rx="0" fill="#172D4B"/><rect id="Logo placeholder-3" data-layer-name="Logo placeholder" data-editable="true" x="55" y="35" width="85" height="85" rx="14" fill="#FFFFFF" stroke="#172D4B" stroke-width="3"/><text id="Logo text placeholder-4" data-layer-name="Logo text placeholder" data-editable="true" x="97.5" y="84.5" font-family="Noto Sans Bengali, Hind Siliguri, sans-serif" font-size="18" font-weight="700" fill="#172D4B" text-anchor="middle">লোগো</text><text id="Company name-5" data-layer-name="Company name" data-editable="true" x="165" y="88" font-family="Noto Sans Bengali, Hind Siliguri, sans-serif" font-size="31" font-weight="800" fill="#FFFFFF" text-anchor="start">কোম্পানির নাম</text><text id="Contact line-6" data-layer-name="Contact line" data-editable="true" x="165" y="122" font-family="Noto Sans Bengali, Hind Siliguri, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" text-anchor="start">ঠিকানা • ফোন • ইমেইল • ওয়েবসাইট</text><line id="Header divider-7" data-layer-name="Header divider" data-editable="true" x1="55" y1="190" x2="845" y2="190" stroke="#477B68" stroke-width="5"/><text id="Date label-8" data-layer-name="Date label" data-editable="true" x="70" y="255" font-family="Noto Sans Bengali, Hind Siliguri, sans-serif" font-size="18" font-weight="600" fill="#172D4B" text-anchor="start">তারিখ:</text><line id="Date underline-9" data-layer-name="Date underline" data-editable="true" x1="150" y1="260" x2="835" y2="260" stroke="#DCCFB8" stroke-width="2"/><rect id="Writing canvas-10" data-layer-name="Writing canvas" data-editable="true" x="60" y="295" width="780" height="760" rx="6" fill="#FFFFFF" stroke="#DCCFB8" stroke-width="1"/><rect id="Letterhead footer-11" data-layer-name="Letterhead footer" data-editable="true" x="0" y="1095" width="900" height="105" rx="0" fill="#EFE8D9"/><text id="Footer details-12" data-layer-name="Footer details" data-editable="true" x="450.0" y="1152" font-family="Noto Sans Bengali, Hind Siliguri, sans-serif" font-size="18" font-weight="600" fill="#172D4B" text-anchor="middle">অফিস ঠিকানা • ফোন • ইমেইল • ওয়েবসাইট</text><rect id="safe-area-guide" data-layer-name="Safe area guide (non-printing)" data-editable="false" x="18" y="18" width="864" height="1164" rx="8" fill="none" stroke="#AAB6C4" stroke-width="2" stroke-dasharray="10 10" opacity="0.45"/></g>
</svg>