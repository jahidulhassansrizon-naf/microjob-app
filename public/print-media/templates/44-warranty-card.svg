<text x="10" y="17.3" font-size="3" fill="#bae6fd" font-weight="600" letter-spacing="1.8">WARRANTY CARD</text>
<text x="138" y="10" font-size="5.5" fill="#ffffff" font-weight="700" text-anchor="end">আপনার দোকানের নাম</text>
<text x="138" y="16" font-size="3.4" fill="#bae6fd" font-weight="500" text-anchor="end">মোবাইল: ০১৭০০-০০০০০০</text>
