<rect x="10" y="65" width="128" height="22" fill="#f0f9ff" rx="2" stroke="#bae6fd" stroke-width="0.3" data-layer-name="Terms box"/>
<text x="13" y="71" font-size="3.2" fill="#334155" font-weight="500">১. ওয়ারেন্টি কার্ড ও মেমো ছাড়া কোনো সার্ভিস দেওয়া হবে না।</text>
<text x="13" y="77" font-size="3.2" fill="#334155" font-weight="500">২. পানিতে ভেজা, ভাঙা বা অনুমোদনহীন মেরামতে ওয়ারেন্টি প্রযোজ্য নয়।</text>
<text x="13" y="83" font-size="3.2" fill="#334155" font-weight="500">৩. সার্ভিসের সময় সিরিয়াল / IMEI নম্বর মিলিয়ে দেখা হবে।</text>
