<text x="105" y="94" font-size="5" fill="#444" font-weight="600" text-anchor="middle" data-layer-name="Message line 1">আপনার জীবন সুখ, শান্তি ও ভালোবাসায় ভরে উঠুক।</text>
<text x="105" y="102" font-size="4.4" fill="#555" font-weight="500" text-anchor="middle" data-layer-name="Message line 2">আল্লাহ আপনাকে সুস্থ ও দীর্ঘজীবী করুন — এই কামনা করি।</text>
<text x="105" y="124" font-size="4.6" fill="#9f1239" font-weight="700" text-anchor="middle">— প্রীতি ও শুভকামনায়</text>
<text x="105" y="132" font-size="5.2" fill="#333" font-weight="800" text-anchor="middle" data-layer-name="Sender name">প্রেরকের নাম লিখুন</text>
