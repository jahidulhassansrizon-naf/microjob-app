<text x="105" y="62" font-size="17" fill="#be123c" font-weight="800" text-anchor="middle" data-layer-name="Title">অনেক অনেক শুভেচ্ছা</text>
<text x="105" y="74" font-size="7" fill="#9f1239" font-weight="700" text-anchor="middle" data-layer-name="Occasion">শুভ জন্মদিন  /  শুভ বিবাহ বার্ষিকী</text>
