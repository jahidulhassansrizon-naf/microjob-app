<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Mobile Banking QR Sticker editable print media template">
<title>Mobile Banking QR Sticker</title><desc>Editable SVG print template. Text, shapes, placeholders and colors are separate vector elements.</desc>
<rect id="background" data-layer-name="Background" data-editable="true" x="0" y="0" width="1000" height="1000" fill="#F7F8FC"/>
<g id="decorative-background" data-layer-name="Decorative background"><circle id="Decorative corner circle-0" data-layer-name="Decorative corner circle" data-editable="true" cx="965" cy="35" r="110" fill="#ECE8F7"/><circle id="Decorative corner accent-1" data-layer-name="Decorative corner accent" data-editable="true" cx="25" cy="975" r="85" fill="#12A68A"/><rect id="Label main frame-2" data-layer-name="Label main frame" data-editable="true" x="65" y="65" width="870" height="870" rx="30" fill="#FFFFFF" stroke="#54278F" stroke-width="5"/><rect id="QR placeholder-3" data-layer-name="QR placeholder" data-editable="true" x="280.0" y="280.0" width="440.0" height="380.0" rx="12" fill="#ECE8F7" stroke="#D6D1E7" stroke-width="3"/><text id="QR placeholder label-4" data-layer-name="QR placeholder label" data-editable="true" x="500.0" y="500.0" font-family="Noto Sans Bengali, Hind Siliguri, sans-serif" font-size="23" font-weight="800" fill="#54278F" text-anchor="middle">QR CODE</text><rect id="safe-area-guide" data-layer-name="Safe area guide (non-printing)" data-editable="false" x="18" y="18" width="964" height="964" rx="8" fill="none" stroke="#AAB6C4" stroke-width="2" stroke-dasharray="10 10" opacity="0.45"/></g>
</svg>